[package]
name = "oc-clean"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manually prune OpenCode's SQLite database and reclaim disk space"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["opencode", "sqlite", "cleanup", "cli"]
categories = ["command-line-utilities"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false
debug = false

# Size-first variant for distribution artifacts.
[profile.release-small]
inherits = "release"
opt-level = "z"

# Release-grade codegen with debug symbols kept, for profiling and flamegraphs.
[profile.profiling]
inherits = "release"
panic = "unwind"
strip = "none"
debug = "full"

[features]
bench-large = ["dep:tempfile"]

[[bin]]
name = "gen-baseline"
path = "tests/support/gen_baseline.rs"
required-features = ["bench-large"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
] }

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
fs2 = "0.4.3"
indicatif = "0.18.6"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde_json = "1.0.151"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ctrlc = "3.5.0"
