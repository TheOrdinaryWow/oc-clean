name: Release Artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the GitHub Release that receives the built artifacts.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing GitHub Release to (re)build artifacts for.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One unavailable toolchain must not withhold the artifacts that did build.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rusqlite is built with the `bundled` feature, so every target compiles SQLite
      # from C. `cross` supplies the matching cross linker and C toolchain for the
      # Linux targets that the x86_64 runner cannot link natively.
      - name: Build and upload archive
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: oc-clean
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          ref: refs/tags/${{ inputs.tag }}
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
