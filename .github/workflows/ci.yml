name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    # Every matrix job runs the full suite natively. Windows exercises Restart Manager
    # holder detection, and macOS exercises libproc vnode holder detection. Before this
    # matrix, those platform paths received local cross-target compile/type checks only;
    # CI provides their runtime behavioral verification on native hosts.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install nightly Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          # target includes libsqlite3-sys output from the bundled SQLite C build.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nightly-${{ steps.toolchain.outputs.cachekey }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nightly-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo nextest run
